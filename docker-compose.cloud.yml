name: sesamekiller-compass

services:
  rag-service:
    build:
      context: ./services/rag-service
    container_name: sesamekiller-compass-rag-service
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      PORT: 5001
      AUTO_SEED: ${AUTO_SEED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      NEO4J_URI: ${NEO4J_URI:?NEO4J_URI is required}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    volumes:
      - ./database/seed:/app/database/seed:ro
    ports:
      - "5001:5001"

  api:
    build:
      context: ./apps/api
    container_name: sesamekiller-compass-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      RAG_SERVICE_URL: http://rag-service:5001
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    ports:
      - "3001:3001"
    depends_on:
      - rag-service

  frontend:
    build:
      context: ./apps/frontend
    container_name: sesamekiller-compass-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
      VITE_GRAPHQL_URL: /graphql
      API_PROXY_TARGET: http://api:3001
    ports:
      - "5173:5173"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: sesamekiller-compass-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
